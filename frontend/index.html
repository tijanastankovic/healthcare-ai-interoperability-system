<!DOCTYPE html>
<html>
<head>
  <title>Healthcare AI System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ANALYZE -->
<div class="card">
  <h2><i class="fa-solid fa-heart-pulse"></i> Analyze Patient</h2>

  <input id="name" placeholder="Name">
  <input id="surname" placeholder="Surname">
  <input id="birthDate" type="date">
  <input id="bp" placeholder="Blood Pressure">
  <input id="chol" placeholder="Cholesterol">

  <button onclick="send()">Analyze</button>

  <div id="analyzeResult"></div>
</div>

<!-- LOAD -->
<div class="card">
  <h2><i class="fa-solid fa-folder-open"></i> Load Patient</h2>

  <input id="loadId" placeholder="Enter Patient ID">

  <button onclick="loadPatient()">Load</button>

  <div id="loadResult"></div>
</div>

<!-- HISTORY -->
<div class="card wide">
  <h2><i class="fa-solid fa-chart-line"></i> Patient History</h2>

  <button onclick="loadHistory()">Refresh</button>

  <div id="historyList"></div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
